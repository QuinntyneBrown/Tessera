name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm e2e:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combobox-performance
          path: test-results/
      - run: pnpm e2e:packed
  video-stream-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/video-stream-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # FFmpeg lets the opt-in integration test run the real pipeline instead of skipping.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet test
