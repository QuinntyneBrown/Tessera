<tsr-scorm-player
  [source]="fixture.source"
  [attempt]="fixture.attempt"
  [host]="fixture.host"
  (event)="onEvent($event)"
/>
<ol aria-label="Host events">
  @for (event of events(); track $index) {
    <li>{{ event }}</li>
  }
</ol>
<ol aria-label="Host saves">
  @for (save of saves(); track $index) {
    <li>{{ save }}</li>
  }
</ol>
